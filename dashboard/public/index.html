<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AGENT-OS 总控看板</title>
<style>
  :root{--bg:#0d0b14;--panel:#16121f;--line:#2a2340;--txt:#cfc9e0;--dim:#7a7390;--pri:#b388ff;--ok:#7ee787;--warn:#ffa657;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--txt);font:14px/1.6 "SF Mono",Menlo,monospace;padding:18px}
  h1{color:var(--pri);font-size:20px;letter-spacing:2px}
  .sub{color:var(--dim);font-size:12px;margin:4px 0 16px}
  .zone{margin-bottom:22px}
  .zone>h2{color:var(--pri);font-size:15px;border-left:3px solid var(--pri);padding-left:8px;margin-bottom:10px}
  .group>h3{color:var(--dim);font-size:12px;margin:10px 0 6px;letter-spacing:1px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;transition:border .15s}
  .card:hover{border-color:var(--pri)}
  .card .name{color:#fff;font-weight:bold}
  .card .text{color:var(--txt);font-size:12px;margin-top:4px;word-break:break-all}
  .card .extra{color:var(--dim);font-size:11px;margin-top:4px}
  .badge{display:inline-block;font-size:10px;padding:0 6px;border-radius:8px;border:1px solid var(--line);color:var(--dim);margin-left:6px}
  .badge.has{color:var(--ok);border-color:var(--ok)}
  .badge.draft{color:var(--warn);border-color:var(--warn)}
  .kv{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:12px}
  .kv b{color:var(--pri)}
  .log{color:var(--dim);font-size:11px}
  #chatbox{position:fixed;right:18px;bottom:18px;width:380px;max-width:92vw;background:var(--panel);border:1px solid var(--pri);border-radius:10px;display:flex;flex-direction:column;height:420px}
  #chathead{padding:8px 12px;color:var(--pri);font-size:13px;border-bottom:1px solid var(--line)}
  #msgs{flex:1;overflow-y:auto;padding:10px;font-size:12px}
  #msgs .m{margin-bottom:8px;white-space:pre-wrap;word-break:break-all}
  #msgs .u{color:#8ab4ff}
  #msgs .a{color:var(--txt)}
  #msgs .err{color:var(--warn)}
  #inputrow{display:flex;border-top:1px solid var(--line)}
  #input{flex:1;background:transparent;border:none;color:var(--txt);padding:10px;font:inherit;outline:none}
  #send{background:var(--pri);color:#12081f;border:none;padding:0 16px;font-weight:bold;cursor:pointer}
  .loading{color:var(--dim);animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.3}}
</style>
</head>
<body>
<h1>⌘ AGENT-OS 总控看板</h1>
<div class="sub">宪法 → 各家规矩 → 观澜板 ｜ 点卡片进项目，底部对话框直接跟总控管家说 ｜ <span id="meta"></span></div>

<div class="zone" id="masterZone">
  <h2>宪法（全局层）</h2>
  <div id="masterBody"></div>
</div>

<div class="zone" id="indexZone"><h2>观澜板（项目地图）</h2><div id="indexBody"></div></div>
<div class="zone" id="skillZone"><h2>全局 skill 库</h2><div id="skillBody"></div></div>

<div id="chatbox">
  <div id="chathead">🗂 总控管家（example-model）</div>
  <div id="msgs"><div class="a">输入任意总控级问题：看状态、路由任务、登记无主之地…</div></div>
  <div id="inputrow"><input id="input" placeholder="跟管家说点什么…（Enter 发送）"><button id="send">发</button></div>
</div>

<script>
function badgeFor(t){ if(/已建|已有/.test(t)&&/草稿/.test(t))return'<span class="badge draft">AGENTS.md 草稿</span>';
  if(/AGENTS.md 已有|已定稿/.test(t))return'<span class="badge has">AGENTS.md ✓</span>';
  if(/草稿/.test(t))return'<span class="badge draft">草稿</span>';return''; }

async function load(){
  const s = await (await fetch('/api/state')).json();
  document.getElementById('meta').textContent = s.master.isTemplate ? '⚠️ GLOBAL-MASTER 还是模板——请先 cp 模板生成实例' : '实例已生成 ✓';
  const mb = document.getElementById('masterBody');
  const sec=(t,arr)=>arr&&arr.length?`<div class="kv"><b>${t}</b><br>${arr.map(x=>'· '+x).join('<br>')}</div>`:'';
  mb.innerHTML = sec('通用纪律',s.master.discipline)+sec('项目关联图谱',s.master.graph)+sec('全局 skill 库',s.master.skill)+sec('观澜板维护',s.master.board);

  const ib = document.getElementById('indexBody');
  ib.innerHTML = s.index.map(z=>`<div class="zone"><h3 style="color:#fff;font-size:13px;margin:8px 0">${z.title}</h3>
    ${z.desc.map(d=>`<div class="log">· ${d}</div>`).join('')}
    ${z.groups.map(g=>`<div class="group"><h3>▸ ${g.title}</h3><div class="grid">
      ${g.cards.map(c=>`<div class="card" onclick="openProject('${c.name}')"><span class="name">${c.name}</span>${badgeFor(c.text+c.extra.join(''))}<div class="text">${c.text}</div>${c.extra.map(e=>`<div class="extra">${e}</div>`).join('')}</div>`).join('')}
    </div></div>`).join('')}
    ${z.loose&&z.loose.length?`<div class="grid">${z.loose.map(c=>`<div class="card"><span class="name">${c.name}</span><div class="text">${c.text}</div>${c.extra.map(e=>`<div class="extra">${e}</div>`).join('')}</div>`).join('')}</div>`:''}
  </div>`).join('');

  const table = s.skills.split('\n').filter(l=>/^\|/.test(l)&&!/^\|\s*skill/.test(l)&&!/^\|[-\s|]+$/.test(l));
  document.getElementById('skillBody').innerHTML = '<div class="kv">'+table.map(r=>r.replace(/^\||\|$/g,'').trim()).join('<br>')+'</div>';
}
function openProject(name){ alert(name + '\n\n打开方式：编辑器开 ' + (name==='agent-os'||name==='agent-os-lab' ? '~/Developer/'+name : '该项目目录') + '，或点 Office/Notes 对应域。\n\n细节以该项目 AGENTS.md 为准。'); }

const msgs=document.getElementById('msgs'), input=document.getElementById('input');
async function send(){
  const t=input.value.trim(); if(!t)return; input.value='';
  msgs.insertAdjacentHTML('beforeend',`<div class="m u">你：${t}</div>`);
  const lid='l'+Date.now(); msgs.insertAdjacentHTML('beforeend',`<div class="m loading" id="${lid}">管家思考中…</div>`);
  msgs.scrollTop=msgs.scrollHeight;
  try{
    const r=await (await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:t}]})})).json();
    document.getElementById(lid).remove();
    msgs.insertAdjacentHTML('beforeend',`<div class="m ${r.ok?'a':'err'}">管家：${r.ok?r.reply:r.error}</div>`);
  }catch(e){ document.getElementById(lid).remove(); msgs.insertAdjacentHTML('beforeend',`<div class="m err">管家：连接失败 ${e}</div>`); }
  msgs.scrollTop=msgs.scrollHeight;
}
document.getElementById('send').onclick=send;
input.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
load();
</script>
</body>
</html>
